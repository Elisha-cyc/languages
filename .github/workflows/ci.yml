name: LinguaApp CI

on:
  push:
    branches: [main, complete-hsk-course-lessons, finish-placement-assessment]
  pull_request:
    branches: [main]

jobs:
  app-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx expo export --platform web

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test -- course.test.js placement.test.js auth-flow.test.js sleep.test.js
      - run: node --check placement.js
      - run: node --check course.js
      - run: node --check course-validation.js
      - run: node --check tts.js
      - run: node --check sleep.js
      - run: node --check hanzi.js
      - run: node --check server.js

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingua_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: lingua_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create an isolated baseline schema
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN;
            END IF;
          END
          $$;

          CREATE TABLE public.languages (
            name text PRIMARY KEY
          );
          CREATE TABLE public.levels (
            name text PRIMARY KEY
          );
          CREATE TABLE public.users (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
          );
          CREATE TABLE public.units (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            language_id integer,
            level_id integer
          );
          CREATE TABLE public.lessons (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
          );
          CREATE TABLE public.words (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
          );
          CREATE TABLE public.sleep_sessions (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY
          );
          CREATE TABLE public.sleep_items (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            session_id integer REFERENCES public.sleep_sessions(id)
          );
          CREATE TABLE public.sleep_session_words (
            session_id integer REFERENCES public.sleep_sessions(id),
            word_id integer REFERENCES public.words(id),
            PRIMARY KEY (session_id, word_id)
          );
          SQL
      - name: Apply every committed Supabase migration to the disposable database
        run: |
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql --set ON_ERROR_STOP=1 --file "$migration"
          done
      - name: Verify course schema, RLS and least-privilege grants
        run: |
          psql --set ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            v_table_name text;
            course_tables text[] := ARRAY[
              'course_lesson_content',
              'course_attempts',
              'course_skill_progress',
              'vocabulary_reviews',
              'course_enrollments',
              'course_conversation_turns'
            ];
          BEGIN
            FOREACH v_table_name IN ARRAY course_tables LOOP
              IF NOT EXISTS (
                SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relname = v_table_name
                  AND c.relrowsecurity
              ) THEN
                RAISE EXCEPTION 'RLS is not enabled on public.%', v_table_name;
              END IF;

              IF has_table_privilege('anon', 'public.' || v_table_name, 'SELECT')
                 OR has_table_privilege('anon', 'public.' || v_table_name, 'INSERT')
                 OR has_table_privilege('authenticated', 'public.' || v_table_name, 'SELECT')
                 OR has_table_privilege('authenticated', 'public.' || v_table_name, 'INSERT') THEN
                RAISE EXCEPTION 'Browser roles have unexpected access to public.%', v_table_name;
              END IF;

              IF NOT has_table_privilege('service_role', 'public.' || v_table_name, 'SELECT')
                 OR NOT has_table_privilege('service_role', 'public.' || v_table_name, 'INSERT') THEN
                RAISE EXCEPTION 'Trusted server role is missing access to public.%', v_table_name;
              END IF;
            END LOOP;

            IF NOT EXISTS (
              SELECT 1 FROM information_schema.columns AS columns
              WHERE table_schema = 'public'
                AND columns.table_name = 'course_lesson_content'
                AND column_name = 'native_language'
            ) THEN
              RAISE EXCEPTION 'Native-language-specific course content column is missing';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_constraint
              WHERE conrelid = 'public.course_lesson_content'::regclass
                AND contype = 'p'
                AND pg_get_constraintdef(oid) = 'PRIMARY KEY (lesson_id, native_language)'
            ) THEN
              RAISE EXCEPTION 'Course content must be unique per lesson and native language';
            END IF;
          END
          $$;
          SQL
